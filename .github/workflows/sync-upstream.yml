name: Sync Upstream

on:
  schedule:
    # Every Monday 02:17 UTC
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build Windows packages even if upstream has no new commits
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: black-ant/Ant-Browser
  UPSTREAM_BRANCH: master

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows; set a PAT (repo + workflow scope) as SYNC_TOKEN for that.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "Upstream commits not in fork: $behind"
          if [[ "$behind" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
              git merge --abort
              echo "::error::Merge conflict with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}; resolve locally."
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_build
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
      release_type: rc
    secrets: inherit
