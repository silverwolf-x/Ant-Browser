name: Build Windows Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional base version override, for example 1.9.0 (default reads wails.json, i.e. upstream's version)
        required: false
        type: string
      release_type:
        description: "none = artifacts only; rc = prerelease V<version>-rc.N; final = release V<version>"
        required: false
        type: choice
        options:
          - none
          - rc
          - final
        default: none
  workflow_call:
    inputs:
      ref:
        description: Commit/branch to build
        required: false
        type: string
      version:
        required: false
        type: string
      release_type:
        required: false
        type: string
        default: rc
  push:
    tags:
      - "V*"

permissions:
  contents: write

concurrency:
  group: build-windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest
    outputs:
      label: ${{ steps.version.outputs.label }}
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.version.outputs.mode }}
      sha: ${{ steps.version.outputs.sha }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Wails v2 binding generation breaks on newer Go toolchains; keep the go.mod version.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI and Go modules
        run: |
          # Prefetch via proxy.golang.org; publish.ps1 forces goproxy.cn, which is slow from GitHub runners.
          go mod download
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Ensure NSIS
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          # base  = numeric version baked into the exe/installer (follows upstream wails.json)
          # label = version shown in tag and file names (base, base-rc.N, or the pushed tag)
          if ("$env:GITHUB_REF" -like 'refs/tags/V*') {
            $label = "$env:GITHUB_REF_NAME".Substring(1)
            $base = ($label -split '-', 2)[0]
            $mode = 'tag'
          } else {
            $base = "$env:VERSION_INPUT".Trim()
            if (-not $base) { $base = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion }
            $mode = if ($env:RELEASE_TYPE) { $env:RELEASE_TYPE } else { 'none' }
            $label = $base
            if ($mode -eq 'rc') {
              $prefix = "refs/tags/V$base-rc."
              $nums = git ls-remote --tags origin "$prefix*" | ForEach-Object {
                $ref = ($_ -split "`t")[1]
                if ($ref -match '^refs/tags/V.+-rc\.(\d+)$') { [int]$Matches[1] }
              }
              $next = 1 + (@($nums) + 0 | Measure-Object -Maximum).Maximum
              $label = "$base-rc.$next"
            }
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "tag=V$label" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          Write-Host "Base: $base  Label: $label  Mode: $mode"

      - name: Build setup + portable
        env:
          CI: "1"
          NO_PAUSE: "1"
          BROWSERSLIST_IGNORE_OLD_DATA: "1"
          ANT_BROWSER_PUBLISH_BEST_COMPRESSION: "1"
        run: ./bat/publish.ps1 -Target WINDOWS -WindowsFormat BOTH -Version "${{ steps.version.outputs.base }}"

      - name: Name outputs and validate
        run: |
          $base = "${{ steps.version.outputs.base }}"
          $label = "${{ steps.version.outputs.label }}"
          $pairs = @(
            @("AntBrowser-Setup-$base.exe", "AntBrowser-Setup-$label.exe"),
            @("AntBrowser-$base-windows-amd64-portable.zip", "AntBrowser-$label-windows-amd64-portable.zip")
          )
          foreach ($p in $pairs) {
            $src = "publish/output/$($p[0])"
            if (-not (Test-Path $src)) { throw "Missing $src" }
            if ($p[0] -ne $p[1]) { Rename-Item $src $p[1] }
            $dst = "publish/output/$($p[1])"
            Write-Host ("{0}  {1:N1} MB" -f $dst, ((Get-Item $dst).Length / 1MB))
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ant-browser-windows-amd64-${{ steps.version.outputs.label }}
          path: |
            publish/output/AntBrowser-Setup-*.exe
            publish/output/AntBrowser-*-windows-amd64-portable.zip
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.mode != 'none'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          MODE: ${{ needs.build.outputs.mode }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          flags=(--title "$TAG" --generate-notes)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease) || flags+=(--latest)
          case "$MODE" in
            tag)
              gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "${flags[@]}"
              ;;
            final)
              # One final release per version: rebuilding replaces assets and moves the tag.
              gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
              gh release create "$TAG" --target "$SHA" "${flags[@]}"
              ;;
            rc)
              gh release create "$TAG" --target "$SHA" "${flags[@]}"
              ;;
          esac
          gh release upload "$TAG" release-artifacts/* --clobber
